{% extends 'dashboard_base.html' %}

{% block title %}Add Patient | PulseMed{% endblock %}

{% block content %}
<div class="space-y-6 fade-in" x-data="{ 
    medicines: [{id: 1}], 
    addMedicine() { this.medicines.push({id: Date.now()}) },
    removeMedicine(id) { this.medicines = this.medicines.filter(m => m.id !== id) }
}">
    
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="{% url 'patient_list' %}" class="p-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                <i data-lucide="arrow-left" class="h-5 w-5"></i>
            </a>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">New Patient Registration</h1>
        </div>
    </div>

    <form method="POST" action="{% url 'add_patient' %}" class="space-y-8 pb-12">
        {% csrf_token %}
        
        <!-- Section: Personal Info -->
        <div class="bg-white dark:bg-darkcard border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm slide-up" x-data="{ charges: 500, amountPaid: 500, get due() { return Math.max(0, this.charges - this.amountPaid) } }">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100 dark:border-gray-800">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-50 dark:bg-blue-900/20 text-blue-600 rounded-lg">
                        <i data-lucide="user" class="h-5 w-5"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Registration & Billing Details</h2>
                </div>
                <div class="text-sm font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 px-3 py-1.5 rounded-lg" x-text="new Date().toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'})"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Patient Name *</label>
                    <input type="text" name="full_name" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Gender *</label>
                    <select name="gender" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all appearance-none">
                        <option value="" disabled selected>Select...</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Age *</label>
                    <input type="number" name="age" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone Number *</label>
                    <input type="tel" name="phone" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Diagnosis</label>
                    <input type="text" name="diagnosis" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div class="md:col-span-2 lg:col-span-3">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Treatment</label>
                    <input type="text" name="treatment" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Charges (₹) *</label>
                    <input type="number" name="consultation_fee" x-model.number="charges" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Amount Paid (₹) *</label>
                    <input type="number" name="amount_paid" x-model.number="amountPaid" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Due (₹)</label>
                    <input type="number" disabled :value="due" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-100 dark:bg-gray-800 text-red-500 font-bold focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all cursor-not-allowed">
                </div>
            </div>
        </div>

        <!-- Section: Prescription -->
        <div class="bg-white dark:bg-darkcard border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm slide-up" style="animation-delay: 100ms;">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100 dark:border-gray-800">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-purple-50 dark:bg-purple-900/20 text-purple-600 rounded-lg">
                        <i data-lucide="pill" class="h-5 w-5"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">Prescription</h2>
                </div>
                <button type="button" @click="addMedicine()" class="text-sm font-medium text-primary hover:text-indigo-600 flex items-center gap-1">
                    <i data-lucide="plus" class="h-4 w-4"></i> Add Medicine
                </button>
            </div>
            
            <div class="space-y-4">
                <template x-for="(medicine, index) in medicines" :key="medicine.id">
                    <div class="flex flex-col md:flex-row gap-4 items-start p-4 bg-gray-50 dark:bg-gray-800/50 rounded-xl border border-gray-100 dark:border-gray-700 relative group">
                        
                        <button type="button" @click="removeMedicine(medicine.id)" x-show="medicines.length > 1" class="absolute -top-2 -right-2 bg-red-100 text-red-600 dark:bg-red-900 dark:text-red-400 rounded-full p-1 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="x" class="h-4 w-4"></i>
                        </button>
                        
                        <div class="w-full">
                            <label class="block text-xs font-medium text-gray-500 mb-1">Medicine Name</label>
                            <input type="text" name="medicine_name[]" placeholder="e.g. Paracetamol 500mg, 2 times/day, 3 days, After food" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary/50 text-sm outline-none">
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex justify-end gap-4 slide-up" style="animation-delay: 400ms;">
            <a href="{% url 'patient_list' %}" class="px-6 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 transition-colors shadow-sm">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 bg-primary text-white rounded-xl text-sm font-medium hover:bg-indigo-600 transition-all transform hover:-translate-y-0.5 shadow-sm flex items-center gap-2">
                <i data-lucide="save" class="h-4 w-4"></i>
                Save Patient
            </button>
        </div>
    </form>
</div>
{% endblock %}
